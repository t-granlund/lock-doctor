<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Lock Doctor — your key</title>
<link rel="icon" type="image/png" href="spruce-logos/spruce_grove_badge_ember.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,800&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:radial-gradient(700px 420px at 50% 18%,rgba(88,143,94,.18),transparent 65%),#1d211e;color:#d6d2c8}
  .card{width:100%;max-width:400px;text-align:center;background:rgba(45,79,58,.14);border:1px solid rgba(240,225,200,.16);border-radius:22px;padding:38px 26px 32px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
  .mark{width:74px;margin:0 auto 20px;display:block;opacity:.92}
  .kicker{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.24em;font-size:.6rem;color:#588f5e}
  .kicker.ember{color:#d2a069}
  h1{font-family:'Fraunces',serif;font-weight:600;color:#f0e1c8;font-size:1.9rem;line-height:1.15;margin:12px 0 26px}
  input{width:100%;font-family:'JetBrains Mono',monospace;font-size:1.35rem;letter-spacing:.42em;text-align:center;text-transform:uppercase;
    background:rgba(29,33,30,.9);color:#f0e1c8;border:1px solid rgba(240,225,200,.18);border-radius:14px;padding:16px 8px;outline:none}
  input:focus{border-color:#d2a069}
  button{width:100%;margin-top:14px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.18em;font-size:.8rem;font-weight:700;
    color:#1d211e;background:#d2a069;border:none;border-radius:14px;padding:16px;cursor:pointer}
  button:hover{filter:brightness(1.07)}
  .msg{font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;margin-top:14px;min-height:1.2em;color:#d2a069}
  .shake{animation:shake .4s}@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .hint{font-size:.82rem;color:rgba(214,210,200,.5);margin-top:16px}
  .foot{margin-top:26px;font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(214,210,200,.4)}
</style>
</head>
<body>
<div class="card">
  <svg class="mark" viewBox="0 0 268 160" aria-hidden="true"><g fill="#F2EDE0"><path d="M35.2 84.6 67.2 140 3.2 140Z"/><path d="M129 50.2 180.8 140 77.2 140Z"/><path d="M222.8 84.6 254.8 140 190.8 140Z"/><rect x="3.2" y="148" width="261.6" height="6"/></g></svg>
  <div class="kicker ember">A gift of labor &middot; from the grove</div>
  <h1>Greg — one key<br>turns it.</h1>
  <input id="key" type="password" inputmode="text" maxlength="12" autocomplete="off" placeholder="&bull;&bull;&bull;&bull;&bull;" aria-label="Key">
  <button id="turn">Unlock</button>
  <div class="msg" id="msg"></div>
  <p class="hint">The blade that starts the Bronco.<br>Five characters, starts with H.</p>
  <div class="foot">Tyler &middot; Spruce Grove OS &middot; Bentonville</div>
</div>
<script>
(function(){
  var GATE_KEY='hu101';
  var input=document.getElementById('key'), msg=document.getElementById('msg'),
      btn=document.getElementById('turn'), card=document.querySelector('.card');
  function tryKey(){
    var v=(input.value||'').trim().toLowerCase();
    if(v===GATE_KEY){
      msg.textContent='Pin set. Welcome to the grove.';
      try{ sessionStorage.setItem('grove-handoff-key',GATE_KEY); localStorage.setItem('grove-handoff-key',GATE_KEY); }catch(e){}
      setTimeout(function(){ location.href='home.html'; },420);
    } else {
      msg.textContent='Not this key.';
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      input.value=''; input.focus();
    }
  }
  btn.addEventListener('click',tryKey);
  input.addEventListener('keydown',function(e){ if(e.key==='Enter') tryKey(); });
  setTimeout(function(){ input.focus(); },300);
})();
</script>
</body>
</html>
